{% extends "students/base.html" %}
{% block title %} Student Register Page{% endblock title %}
{% block content %}
<center>
    <h1>Student Register Page</h1>
    <form  method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ESUFO.as_p}}
        {{ESPFO.as_p}}
        <input type="submit" value="Register">
    </form>
</center>
{% endblock content %}
