<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 
        {% block title %}{% endblock title %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary position-relative">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'student_home' %}">MockLabs</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'student_home' %}">Home</a>
                </li>

                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'student_logout' %}">Logout</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'myratings' %}">My Ratings</a>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'student_register' %}">Student Register</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'student_login' %}">Login</a>
                </li>
                {% endif %}
            </ul>
        </div>

        <!-- Move Only "Display" to the Top-Right -->
        {% if user.is_authenticated %}
        <a class="nav-link position-absolute top-0 end-0 me-3 mt-2" href="{% url 'student_profile_display' %}">
            <img src="{{Student_Profile_Object.profile_pic.url}}" alt="no Photo" class="me-1" style="width: 50px; height: 50px; border-radius: 50%;">
        </a>
        {% endif %} 
    </div>
</nav>



    {% block content %}{% endblock content %}
</body>
</html>
